services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: crag_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crag_redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    build: .
    container_name: crag_api
    depends_on:
      - qdrant
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_USE_LOCAL: "false"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      FASTEMBED_CACHE_PATH: /models
      REDIS_HOST: redis
    volumes:
      - fastembed_cache:/models
    mem_limit: 3g
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

volumes:
  qdrant_storage:
  fastembed_cache: