services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: crag_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    mem_limit: 1g
    restart: unless-stopped

  api:
    build: .
    container_name: crag_api
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_USE_LOCAL: "false"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - fastembed_cache:/models
    mem_limit: 3g
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

volumes:
  qdrant_storage:
  fastembed_cache: